name: macOS build
run-name: macOS ${{ inputs.mode }} · ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Controlled product task
        type: choice
        options: [runner-probe, probe, smoke, full, revalidate, diagnostic]
        default: probe
        required: true
      source_commit:
        description: Exact private source commit
        type: string
        required: true
      private_draft_tag:
        description: Exact private evidence destination
        type: string
        required: true
      request_id:
        description: Unique dispatch request
        type: string
        required: true
      options_json:
        description: Controlled native validation options
        type: string
        default: '{}'

permissions:
  contents: read

concurrency:
  group: macos-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  native:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'grusirna/codex-assistant' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      BUILD_MODE: ${{ inputs.mode }}
      PRIVATE_DRAFT_TAG: ${{ inputs.private_draft_tag }}
      BUILD_REQUEST_ID: ${{ inputs.request_id }}
      BUILD_OPTIONS_JSON: ${{ inputs.options_json }}
      SOURCE_REPOSITORY: grusirna/codex-assistant-source
      EVIDENCE_REPOSITORY: grusirna/codex-assistant-source
    steps:
      - name: Validate entry
        shell: bash
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$PRIVATE_DRAFT_TAG" =~ ^codex-assistant-macos-build-transport-[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]]
          [[ "$BUILD_REQUEST_ID" =~ ^[a-f0-9-]{36}$ ]]
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/private-build"
          printf 'Apple Silicon runner started.\n'

      - name: Read exact private source
        id: source
        shell: bash
        env:
          SOURCE_READ_KEY: ${{ secrets.SOURCE_READ_KEY }}
        run: |
          set +e
          (
            set -e
            umask 077
            key_file="$RUNNER_TEMP/source-read-key"
            host_file="$RUNNER_TEMP/source-known-hosts"
            trap 'rm -f "$key_file" "$host_file"' EXIT
            printf '%s\n' "$SOURCE_READ_KEY" > "$key_file"
            unset SOURCE_READ_KEY
            curl --fail --silent --show-error --retry 3 https://api.github.com/meta |
              jq -er '.ssh_keys[] | "github.com " + .' > "$host_file"
            export GIT_SSH_COMMAND="/usr/bin/ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$host_file"
            git init --quiet private-source
            cd private-source
            git remote add origin git@github.com:grusirna/codex-assistant-source.git
            git fetch --quiet --no-tags --depth=1 origin "$SOURCE_COMMIT"
            git -c advice.detachedHead=false checkout --quiet --detach FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          ) > "$RUNNER_TEMP/private-build/checkout.log" 2>&1
          result=$?
          printf 'Private source checkout exit status: %s.\n' "$result"
          exit "$result"

      - name: Install pinned JavaScript
        if: inputs.mode != 'runner-probe'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0

      - name: Execute private task
        if: inputs.mode != 'runner-probe'
        id: task
        shell: bash
        working-directory: private-source
        env:
          BUILD_EVIDENCE_TOKEN: ${{ secrets.BUILD_EVIDENCE_TOKEN }}
          HISTORICAL_ARTIFACT_TOKEN: ${{ secrets.HISTORICAL_ARTIFACT_TOKEN }}
        run: |
          set +e
          node scripts/run-macos-builder.mjs run > "$RUNNER_TEMP/private-build/runner.log" 2>&1
          result=$?
          printf 'Private task exit status: %s.\n' "$result"
          exit "$result"

      - name: Return private evidence
        if: ${{ always() && inputs.mode != 'runner-probe' && steps.source.outcome == 'success' }}
        shell: bash
        working-directory: private-source
        env:
          BUILD_EVIDENCE_TOKEN: ${{ secrets.BUILD_EVIDENCE_TOKEN }}
          PRIVATE_TASK_OUTCOME: ${{ steps.task.outcome }}
        run: |
          set +e
          node scripts/run-macos-builder.mjs preserve > "$RUNNER_TEMP/private-build/transport.log" 2>&1
          result=$?
          printf 'Private evidence transport exit status: %s.\n' "$result"
          exit "$result"

      - name: Verify exact private checkout
        if: inputs.mode == 'runner-probe'
        shell: bash
        working-directory: private-source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          printf 'Exact private checkout verified; private write transport needs a separate probe.\n'
